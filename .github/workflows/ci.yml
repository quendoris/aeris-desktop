name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-build:
    name: Ubuntu / Qt6 desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AERIS core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quendoris/aeris-core
          ref: agent/render-scene-geometry-v0
          path: aeris-core

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsqlite3-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DAERIS_CORE_SOURCE_DIR=${{ github.workspace }}/aeris-core
          -DCMAKE_BUILD_TYPE=Release

      - name: Build desktop and fixture tool
        run: >-
          cmake --build build
          --target aeris-desktop aeris-demo-project
          --parallel 2

      - name: Fetch exact pinned demo sources
        run: >-
          cmake
          -DDESTINATION=${{ runner.temp }}/natural-earth-v5.1.2
          -P aeris-core/scripts/fetch_demo_world.cmake

      - name: Build a real durable demo project
        run: >-
          ./build/aeris-demo-project
          ${{ runner.temp }}/natural-earth-v5.1.2
          ${{ runner.temp }}/desktop-demo.aeris

      - name: Prove demo project exists
        shell: bash
        run: |
          set -euo pipefail
          test -s ${{ runner.temp }}/desktop-demo.aeris
          ls -lh ${{ runner.temp }}/desktop-demo.aeris
