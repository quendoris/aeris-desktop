name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: desktop-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-build:
    name: Ubuntu / Qt6 desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout exact AERIS core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quendoris/aeris-core
          ref: 8591bc91ad266e3a1abb942698b960e6bdacf196
          path: aeris-core

      - name: Record exact core dependency
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C aeris-core rev-parse HEAD)" = "8591bc91ad266e3a1abb942698b960e6bdacf196"
          git -C aeris-core log -1 --format='AERIS core: %H %s'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsqlite3-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DAERIS_CORE_SOURCE_DIR=${{ github.workspace }}/aeris-core
          -DCMAKE_BUILD_TYPE=Release

      - name: Build desktop and proof tools
        run: >-
          cmake --build build
          --target aeris-desktop aeris-desktop-project-lifecycle-probe aeris-desktop-render-probe aeris-desktop-projection-catalog-probe
          --parallel 2

      - name: Fetch exact pinned demo sources
        run: >-
          cmake
          -DDESTINATION=${{ runner.temp }}/natural-earth-v5.1.2
          -P aeris-core/scripts/fetch_demo_world.cmake

      - name: Prove empty project creation and data-driven expansion
        run: >-
          ./build/aeris-desktop-project-lifecycle-probe
          ${{ runner.temp }}/natural-earth-v5.1.2
          ${{ runner.temp }}/desktop-demo.aeris

      - name: Remove acquisition sources
        shell: bash
        run: rm -rf ${{ runner.temp }}/natural-earth-v5.1.2

      - name: Prove all catalog projections from aeris only
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ./build/aeris-desktop-projection-catalog-probe
          ${{ runner.temp }}/desktop-demo.aeris

      - name: Render desktop from aeris only
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ./build/aeris-desktop-render-probe
          ${{ runner.temp }}/desktop-demo.aeris
          ${{ runner.temp }}/desktop-demo.png
          ${{ runner.temp }}/desktop-seam.png

      - name: Prove durable project and renders exist
        shell: bash
        run: |
          set -euo pipefail
          test -s ${{ runner.temp }}/desktop-demo.aeris
          test -s ${{ runner.temp }}/desktop-demo.png
          test -s ${{ runner.temp }}/desktop-seam.png
          ls -lh \
            ${{ runner.temp }}/desktop-demo.aeris \
            ${{ runner.temp }}/desktop-demo.png \
            ${{ runner.temp }}/desktop-seam.png

      - name: Upload desktop proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aeris-desktop-proof
          path: |
            ${{ runner.temp }}/desktop-demo.aeris
            ${{ runner.temp }}/desktop-demo.png
            ${{ runner.temp }}/desktop-seam.png
          if-no-files-found: error
          retention-days: 14
