name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux-build:
    name: Ubuntu / Qt6 desktop
    runs-on: ubuntu-latest

    steps:
      - name: Checkout desktop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout AERIS core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: quendoris/aeris-core
          ref: agent/render-scene-geometry-v0
          path: aeris-core

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-base-dev libsqlite3-dev

      - name: Configure
        run: >-
          cmake -S . -B build
          -DAERIS_CORE_SOURCE_DIR=${{ github.workspace }}/aeris-core
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target aeris-desktop --parallel 2
